name: Backend CI

on:
  push:
    branches: [main, development, testing]
  pull_request:

jobs:
  test:
    name: Pruebas con cobertura
    runs-on: ubuntu-latest
    env:
      DJANGO_SECRET_KEY: clave-solo-para-la-integracion-continua
      ALLOWED_HOSTS: localhost
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Análisis estático
        run: python -m pyflakes agenda backendClinica manage.py

      - name: Migraciones
        run: python manage.py migrate --noinput

      - name: Pruebas con cobertura
        run: |
          python -m coverage run manage.py test
          python -m coverage report --fail-under=80

  docker:
    name: Construcción de la imagen Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Construir la imagen
        run: docker build -t clinica-dental-backend .
